<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-commerce</title>
  <link rel="stylesheet" href="../GROUP2/valeria/GROUP2/Styles/Customer.css ">
</head>
<body>
  <div class="top-bar">
    <button>⬅</button>
    <button>➡</button>
    <button>⨉</button>
    <button>🏠</button>
    <input type="text" placeholder="Enter URL here">
    <button>🔍</button>
  </div>

  <div class="chat-window">
    <div class="chat-header">
      <span>Chat</span>
    </div>
    <div class="chat-body">
      <p><strong>Hi!</strong> Welcome to <em>(Craftify)</em>. I'm your virtual assistant. While I'm not human, I can still answer questions. What would you like to chat about today?</p>
    </div>
    <div class="chat-footer">
      <input type="text" placeholder="Type your question here">
      <button>➤</button>
    </div>
  </div>
</body>
